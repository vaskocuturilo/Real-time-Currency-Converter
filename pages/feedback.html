<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We're Sorry to See You Go - Real-Time Currency Converter</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent-purple: #818cf8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 680px;
            width: 100%;
        }

        .feedback-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            border-radius: 16px;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Reasons Form Options */
        .reasons-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .reason-option {
            position: relative;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s, transform 0.1s;
        }

        .reason-option:hover {
            border-color: #475569;
            background: rgba(15, 23, 42, 0.8);
        }

        .reason-option.selected {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.08);
        }

        .reason-option input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            outline: none;
            transition: border-color 0.2s;
        }

        .reason-option.selected input[type="radio"] {
            border-color: var(--primary);
            background-color: var(--primary);
            box-shadow: inset 0 0 0 3px var(--card-bg);
        }

        .reason-text {
            font-size: 14px;
            font-weight: 500;
        }

        /* Text inputs */
        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        textarea,
        input[type="email"] {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus,
        input[type="email"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Action Button */
        .actions {
            text-align: center;
        }

        #submitBtn {
            width: 100%;
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }

        #submitBtn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        #submitBtn:active {
            transform: translateY(0);
        }

        /* Confirmation State */
        .success-state {
            text-align: center;
            padding: 20px 0;
        }

        .success-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .success-state h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .success-state p {
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="feedback-card" id="feedbackCard">
            <div class="header">
                <div class="logo-badge">💬</div>
                <h1>We're Sorry to See You Go</h1>
                <p class="subtitle">Your honest feedback helps us fix bugs and improve future updates.</p>
            </div>

            <form id="feedbackForm">
                <!-- Radio Option Cards -->
                <div class="reasons-group">
                    <label class="reason-option">
                        <input type="radio" name="reason" value="better_alternative" required>
                        <span class="reason-text">🎯 Found a better alternative</span>
                    </label>
                    <label class="reason-option">
                        <input type="radio" name="reason" value="parsing_issues">
                        <span class="reason-text">⚡ Currencies or amounts were not detected correctly</span>
                    </label>
                    <label class="reason-option">
                        <input type="radio" name="reason" value="confusing_ui">
                        <span class="reason-text">⚙️ Hard to use or confusing interface</span>
                    </label>
                    <label class="reason-option">
                        <input type="radio" name="reason" value="missing_currency">
                        <span class="reason-text">🧩 Missing a currency or feature I needed</span>
                    </label>
                    <label class="reason-option">
                        <input type="radio" name="reason" value="temporary_use">
                        <span class="reason-text">🔕 Only needed it temporarily</span>
                    </label>
                    <label class="reason-option">
                        <input type="radio" name="reason" value="other">
                        <span class="reason-text">💬 Other reason</span>
                    </label>
                </div>

                <!-- Optional Detailed Comment -->
                <div class="input-group">
                    <label for="detailsInput">Tell us more (optional)</label>
                    <textarea id="detailsInput"
                        placeholder="Let us know what went wrong or how we could improve..."></textarea>
                </div>

                <!-- Optional Email -->
                <div class="input-group">
                    <label for="emailInput">Email address (optional)</label>
                    <input type="email" id="emailInput" placeholder="name@example.com (if you'd like a response)">
                </div>

                <!-- Submit Button -->
                <div class="actions">
                    <button type="submit" id="submitBtn">Submit Feedback</button>
                </div>
            </form>
        </div>
    </div>

    <script src="feedback.js"></script>
</body>

</html>
